[package]
name = "codever-matrix-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
anyhow = "1.0"
base64ct = { version = "1.8", features = ["alloc"] }
ciborium = "0.2"
coset = "0.4.2"
matrix-sdk = { version = "0.18.0", features = ["bundled-sqlite"] }
matrix-sdk-base = "0.18.0"
matrix-sdk-crypto = "0.18.0"
p256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
futures-util = "0.3"
tempfile = "3.23"
tokio = { version = "1.48", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
wiremock = "0.6"
