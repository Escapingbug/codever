[package]
name = "codever-app"
version = "0.1.0"
description = "Codever desktop and mobile shell"
authors = ["Codever contributors"]
edition = "2021"

[lib]
name = "codever_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
