[package]
name = "codever-app"
version = "0.1.0"
description = "Codever desktop and mobile shell"
authors = ["Codever contributors"]
edition = "2021"

[lib]
name = "codever_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring-core = "1.0.0"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain", "protected"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = "1.0.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
